<!doctype html><html><head><meta charset="utf-8"><title>Digital Twin Interactive Dashboard</title><link rel="stylesheet" href="/styles.css"></head><body><main><h1>Digital Twin interactive console</h1><p>Local-only small-topology experiments. Germany50 and formal RL evidence remain read-only.</p><label>Scenario <select id="scenario"></select></label><label>Source <select id="source"></select></label><label>Destination <select id="destination"></select></label><section id="topology"></section><fieldset><legend>Network conditions</legend><label>Bandwidth Mbps <input id="bandwidth_mbps" type="number" min="1" max="1000" value="20"></label><label>One-way delay ms <input id="delay_ms" type="number" min="0" max="500" value="0"></label><label>Loss % <input id="loss_percent" type="number" min="0" max="20" value="0"></label></fieldset><fieldset><legend>Test</legend><select id="test"><option value="ping+iperf3">Ping + iperf3</option><option value="ping">Ping</option><option value="iperf3">iperf3</option></select><label>Ping count <input id="ping_count" type="number" min="1" max="20" value="3"></label><label>iperf seconds <input id="iperf_duration_seconds" type="number" min="1" max="30" value="3"></label></fieldset><label><input id="dry_run" type="checkbox" checked> Dry-run (safe default)</label><label id="confirmWrap" hidden>Type RUN for Docker <input id="confirmation"></label><p><button id="validate">Validate</button><button id="run">Run</button><button id="cancel">Cancel</button><button id="cleanup">Cleanup</button></p><pre id="status">Loading…</pre><p id="downloads"></p></main><script src="/app.js"></script></body></html>
